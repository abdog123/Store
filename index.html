<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VibeTech | متجر المستقبل</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        /* نفس الـ Style السابق مع بعض التعديلات */
        :root {
            --primary: #1a1a2e;
            --gold: #f5c842;
            --glass: rgba(255,255,255,0.08);
            --radius: 20px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', sans-serif; }
        body {
            background: linear-gradient(145deg, #0f0f1f 0%, #1a1a2e 100%);
            color: #f1f1f1;
            min-height: 100vh;
        }
        header {
            position: sticky;
            top: 0;
            z-index: 1000;
            backdrop-filter: blur(20px);
            background: var(--glass);
            border-bottom: 1px solid rgba(255,255,255,0.06);
            padding: 14px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .logo {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--gold), #ffd700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .header-btn {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.08);
            color: #fff;
            padding: 10px 18px;
            border-radius: 60px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
        }
        .header-btn:hover {
            background: rgba(255,215,0,0.15);
            border-color: var(--gold);
            transform: scale(1.03);
        }
        .cart-btn {
            background: rgba(255,215,0,0.12);
            border-color: rgba(255,215,0,0.25);
            position: relative;
        }
        .cart-badge {
            background: var(--gold);
            color: #1a1a2e;
            border-radius: 50%;
            width: 22px;
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 800;
            position: absolute;
            top: -6px;
            right: -6px;
        }
        .search-box {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 60px;
            padding: 8px 18px;
            color: #fff;
            width: 180px;
            font-size: 0.85rem;
            transition: 0.3s;
        }
        .search-box:focus {
            outline: none;
            border-color: var(--gold);
            background: rgba(255,255,255,0.1);
            width: 240px;
        }
        .hero {
            background: linear-gradient(135deg, rgba(26,26,46,0.92), rgba(22,33,62,0.85)),
                        url('https://images.unsplash.com/photo-1519389950473-47ba0277781c?q=80&w=2070');
            background-size: cover;
            background-attachment: fixed;
            background-position: center;
            min-height: 280px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
            border-bottom: 1px solid rgba(255,215,0,0.08);
        }
        .hero-content h1 {
            font-size: 2.8rem;
            font-weight: 800;
        }
        .hero-content h1 span {
            background: linear-gradient(135deg, var(--gold), #ffd700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .hero-content p {
            font-size: 1.1rem;
            opacity: 0.7;
            margin: 14px 0 22px;
        }
        .hero-badge {
            background: linear-gradient(135deg, var(--gold), #f5b342);
            color: #1a1a2e;
            padding: 8px 28px;
            border-radius: 60px;
            font-weight: 800;
            display: inline-block;
            font-size: 0.9rem;
        }
        .container {
            padding: 40px 5%;
            max-width: 1400px;
            margin: 0 auto;
        }
        .section-title {
            font-size: 1.6rem;
            font-weight: 800;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .section-title::after {
            content: '';
            flex: 1;
            height: 2px;
            background: linear-gradient(90deg, var(--gold), transparent);
        }
        #loading-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 300px;
            gap: 20px;
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(255,215,0,0.1);
            border-top-color: var(--gold);
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 25px;
        }
        .card {
            background: rgba(255,255,255,0.04);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: var(--radius);
            overflow: hidden;
            cursor: pointer;
            transition: 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 8px 30px rgba(0,0,0,0.2);
            position: relative;
        }
        .card:hover {
            transform: translateY(-8px) scale(1.01);
            border-color: var(--gold);
            box-shadow: 0 20px 60px rgba(232, 185, 49, 0.15);
        }
        .card img {
            width: 100%;
            height: 180px;
            object-fit: contain;
            padding: 18px;
            background: rgba(0,0,0,0.2);
            transition: 0.5s;
        }
        .card:hover img { transform: scale(1.05); }
        .card-info {
            padding: 16px;
            text-align: center;
        }
        .card-info .name {
            font-weight: 600;
            font-size: 0.95rem;
            height: 44px;
            overflow: hidden;
            margin-bottom: 8px;
            color: #e8e8e8;
        }
        .price-wrap {
            display: flex;
            justify-content: center;
            align-items: baseline;
            gap: 8px;
            flex-wrap: wrap;
        }
        .old-price {
            text-decoration: line-through;
            color: #7a7a8a;
            font-size: 0.8rem;
        }
        .price {
            color: var(--gold);
            font-weight: 800;
            font-size: 1.2rem;
        }
        .badge-sale {
            position: absolute;
            top: 12px;
            right: 12px;
            background: #ff6b6b;
            color: #fff;
            padding: 4px 14px;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 800;
        }
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(14px);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-content {
            background: #1e1e32;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 28px;
            padding: 30px;
            width: 100%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 40px 80px rgba(0,0,0,0.6);
        }
        .modal-content img {
            width: 100%;
            height: 180px;
            object-fit: contain;
            background: rgba(0,0,0,0.2);
            border-radius: 16px;
            padding: 10px;
        }
        .modal-close {
            cursor: pointer;
            font-size: 1.4rem;
            color: #aaa;
            float: left;
            transition: 0.3s;
        }
        .modal-close:hover {
            color: #fff;
            transform: rotate(90deg);
        }
        .qty-input {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin: 18px 0;
            background: rgba(255,255,255,0.05);
            padding: 10px;
            border-radius: 16px;
        }
        .qty-btn {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            border: none;
            background: var(--gold);
            color: #1a1a2e;
            font-weight: 800;
            font-size: 1.2rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .qty-btn:hover {
            transform: scale(1.08);
            background: #ffd700;
        }
        .qty-val {
            font-weight: 800;
            font-size: 1.4rem;
            min-width: 30px;
            text-align: center;
        }
        .action-btns {
            display: flex;
            gap: 12px;
            margin-top: 10px;
        }
        .btn {
            border: none;
            padding: 14px;
            border-radius: 14px;
            font-weight: 700;
            cursor: pointer;
            flex: 1;
            transition: 0.3s;
            font-size: 0.95rem;
        }
        .btn-buy {
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            color: #fff;
        }
        .btn-buy:hover {
            transform: scale(1.03);
            box-shadow: 0 10px 30px rgba(238, 90, 36, 0.3);
        }
        .btn-cart {
            background: rgba(255,215,0,0.12);
            color: #fff;
            border: 1px solid rgba(255,215,0,0.2);
        }
        .btn-cart:hover {
            background: rgba(255,215,0,0.2);
        }
        .btn-confirm {
            background: linear-gradient(135deg, var(--gold), #f5b342);
            color: #1a1a2e;
            width: 100%;
            margin-top: 18px;
            font-weight: 800;
            padding: 16px;
            border-radius: 14px;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            transition: 0.3s;
        }
        .btn-confirm:hover {
            transform: scale(1.02);
            box-shadow: 0 10px 40px rgba(232, 185, 49, 0.3);
        }
        .order-item {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 12px;
            transition: 0.3s;
        }
        .order-item:hover {
            border-color: var(--gold);
        }
        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 8px;
        }
        .order-id {
            color: var(--gold);
            font-weight: 800;
        }
        .order-status {
            background: rgba(255,215,0,0.15);
            padding: 4px 16px;
            border-radius: 30px;
            font-size: 0.8rem;
            color: var(--gold);
        }
        .order-status.delivered {
            background: rgba(46, 204, 113, 0.15);
            color: #2ecc71;
        }
        .order-details {
            font-size: 0.85rem;
            opacity: 0.7;
        }
        .empty-orders {
            text-align: center;
            opacity: 0.5;
            padding: 40px 0;
        }
        input, textarea, select {
            width: 100%;
            padding: 14px;
            margin: 8px 0;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 14px;
            background: rgba(255,255,255,0.04);
            color: #fff;
            font-size: 0.95rem;
            transition: 0.3s;
        }
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: var(--gold);
            background: rgba(255,255,255,0.08);
        }
        select option { background: #1a1a2e; }
        .total-row {
            display: flex;
            justify-content: space-between;
            font-weight: 800;
            font-size: 1.1rem;
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px solid rgba(255,255,255,0.06);
        }
        .total-row span:last-child { color: var(--gold); }
        #orderSummary {
            background: rgba(255,255,255,0.05);
            padding: 14px;
            border-radius: 14px;
            font-size: 0.9rem;
            margin-bottom: 16px;
            border-right: 3px solid var(--gold);
        }
        #confirm-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: #0f0f1f;
            z-index: 3000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }
        .progress-box {
            width: 100%;
            max-width: 280px;
            background: rgba(255,255,255,0.06);
            height: 6px;
            border-radius: 10px;
            margin: 24px 0;
            overflow: hidden;
        }
        .progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, var(--gold), #ffd700);
            transition: width 0.3s;
        }
        #confirm-overlay h2 { font-size: 1.8rem; margin-top: 20px; }
        #confirm-overlay p { opacity: 0.6; }
        #toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(30,30,50,0.95);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.06);
            color: #fff;
            padding: 14px 30px;
            border-radius: 60px;
            display: none;
            z-index: 4000;
            font-weight: 600;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        .sync-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.75rem;
            opacity: 0.5;
            padding: 4px 12px;
            border-radius: 30px;
            background: rgba(255,255,255,0.04);
        }
        .sync-status .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }
        .sync-status .dot.online { background: #2ecc71; }
        .sync-status .dot.offline { background: #ff6b6b; }
        .sync-status .dot.syncing { background: #f5c842; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0.3; } }
        @media (max-width: 600px) {
            .hero-content h1 { font-size: 2rem; }
            .search-box { width: 120px; }
            .search-box:focus { width: 160px; }
            .grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
            .card img { height: 130px; }
            .action-btns { flex-direction: column; }
            .header-actions .header-btn { padding: 8px 14px; font-size: 0.75rem; }
        }
    </style>
</head>
<body>

<header>
    <div class="logo">⚡ VibeTech</div>
    <div class="header-actions">
        <input class="search-box" placeholder="🔍 بحث..." id="searchInput" oninput="filterProducts()">
        <span class="sync-status" id="syncStatus">
            <span class="dot" id="syncDot"></span>
            <span id="syncText">جاري التحميل...</span>
        </span>
        <a class="header-btn" href="admin.html" target="_blank">⚙️ لوحة التحكم</a>
        <div class="header-btn cart-btn" onclick="openCart()">
            🛒 السلة
            <span class="cart-badge" id="cartCount">0</span>
        </div>
    </div>
</header>

<section class="hero">
    <div class="hero-content">
        <h1>اكتشف <span>المستقبل</span> الرقمي</h1>
        <p>تقنية فائقة بأسعار تنافسية</p>
        <span class="hero-badge">🔥 خصم يصل إلى 30%</span>
    </div>
</section>

<div class="container">
    <div class="section-title">✨ أحدث المنتجات</div>
    <div id="loading-area"><div class="spinner"></div><p style="opacity:0.5;">جاري تحميل العروض...</p></div>
    <div id="products-grid" class="grid"></div>
</div>

<!-- DETAILS MODAL -->
<div id="detailsModal" class="modal">
    <div class="modal-content">
        <span class="modal-close" onclick="closeModals()">✕</span>
        <img id="dImg" src="">
        <h2 id="dTitle" style="margin:12px 0 6px; text-align:center;"></h2>
        <div style="text-align:center; margin-bottom:10px;">
            <span id="dOldPrice" class="old-price"></span>
            <span id="dPrice" class="price"></span>
        </div>
        <div class="qty-input">
            <button class="qty-btn" onclick="changeQty(-1)">−</button>
            <span class="qty-val" id="qtyVal">1</span>
            <button class="qty-btn" onclick="changeQty(1)">+</button>
        </div>
        <div class="action-btns">
            <button class="btn btn-buy" onclick="goDirectOrder()">شراء الآن ⚡</button>
            <button class="btn btn-cart" onclick="addToCart()">➕ للسلة</button>
        </div>
    </div>
</div>

<!-- CHECKOUT MODAL -->
<div id="checkoutModal" class="modal">
    <div class="modal-content">
        <span class="modal-close" onclick="closeModals()">✕</span>
        <h3>📦 تأكيد الطلب</h3>
        <div id="orderSummary"></div>
        <select id="shipCity" onchange="calcFinal()">
            <option value="0">اختر المدينة</option>
            <option value="50">القاهرة (50 ج.م)</option>
            <option value="100">باقي المحافظات (100 ج.م)</option>
        </select>
        <input type="text" id="uName" placeholder="الاسم الكامل">
        <input type="tel" id="uPhone" placeholder="رقم الهاتف">
        <textarea id="uAddr" placeholder="العنوان بالتفصيل" rows="2"></textarea>
        <div class="total-row">
            <span>الإجمالي</span>
            <span id="finalTotal">0</span>
        </div>
        <button class="btn-confirm" onclick="startOrderProcess()">تأكيد الطلب نهائياً ✅</button>
    </div>
</div>

<!-- ORDERS HISTORY MODAL -->
<div id="ordersModal" class="modal">
    <div class="modal-content">
        <span class="modal-close" onclick="closeModals()">✕</span>
        <h3 style="text-align:center; margin-bottom:20px;">📋 سجل طلباتي</h3>
        <div id="ordersList"></div>
    </div>
</div>

<!-- CONFIRM OVERLAY -->
<div id="confirm-overlay">
    <div class="spinner" style="width:56px;height:56px;"></div>
    <h2 id="processText">جاري معالجة طلبك...</h2>
    <p>نقوم بحجز المنتجات لك</p>
    <div class="progress-box"><div class="progress-bar" id="pBar"></div></div>
</div>

<div id="toast"></div>

<script>
    // ============================================================
    //  CONFIG - تلغرام
    // ============================================================
    
    const TELEGRAM_BOT_TOKEN = '8868804045:AAGWekYXy1tmLhFGKLREVZ-l4s9BFSu_Pks';
    const TELEGRAM_CHAT_ID = '6404702739';

    // ============================================================
    //  STORAGE HELPERS
    // ============================================================

    const PRODUCTS_KEY = 'vibetech_products';
    const ORDERS_KEY = 'vibetech_orders';
    const CART_KEY = 'vibetech_cart';

    function getLocalProducts() {
        try {
            const data = localStorage.getItem(PRODUCTS_KEY);
            if (data) return JSON.parse(data);
        } catch {}
        return null;
    }

    function setLocalProducts(products) {
        localStorage.setItem(PRODUCTS_KEY, JSON.stringify(products));
    }

    function getOrders() {
        try {
            return JSON.parse(localStorage.getItem(ORDERS_KEY)) || [];
        } catch { return []; }
    }

    function saveOrders(orders) {
        localStorage.setItem(ORDERS_KEY, JSON.stringify(orders));
    }

    // ============================================================
    //  CART PERSISTENCE (حفظ السلة في المتصفح)
    // ============================================================

    function saveCart(cart) {
        localStorage.setItem(CART_KEY, JSON.stringify(cart));
    }

    function loadCart() {
        try {
            const data = localStorage.getItem(CART_KEY);
            return data ? JSON.parse(data) : [];
        } catch { return []; }
    }

    // ============================================================
    //  TELEGRAM NOTIFICATIONS
    // ============================================================

    async function sendTelegramMessage(message) {
        try {
            const url = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`;
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: TELEGRAM_CHAT_ID,
                    text: message,
                    parse_mode: 'HTML'
                })
            });
            if (!response.ok) throw new Error('Telegram API error');
            console.log('✅ Telegram message sent');
        } catch (error) {
            console.warn('⚠️ Failed to send Telegram message:', error);
        }
    }

    // ============================================================
    //  SYNC WITH GOOGLE SHEETS (اختياري)
    // ============================================================

    const SCRIPT_URL = 'https://script.google.com/macros/s/يُضاف_الرابط_هنا/exec';
    let products = [];
    let isOnline = true;

    async function syncProducts() {
        const statusDot = document.getElementById('syncDot');
        const statusText = document.getElementById('syncText');
        
        statusDot.className = 'dot syncing';
        statusText.innerText = 'جاري المزامنة...';

        try {
            // حاول جلب البيانات من Google Sheets
            const response = await fetch(SCRIPT_URL);
            if (!response.ok) throw new Error('Network error');
            const data = await response.json();
            
            if (data && data.length) {
                const validData = data.map(p => ({
                    ...p,
                    id: p.id || 'p_' + Math.random().toString(36).substr(2, 6)
                }));
                setLocalProducts(validData);
                products = validData;
                isOnline = true;
                statusDot.className = 'dot online';
                statusText.innerText = 'متصل ✓';
            } else {
                throw new Error('No data');
            }
        } catch (error) {
            console.warn('Sync failed, using cache:', error);
            isOnline = false;
            statusDot.className = 'dot offline';
            statusText.innerText = 'غير متصل (حفظ محلي)';
            
            const cached = getLocalProducts();
            if (cached && cached.length) {
                products = cached;
            } else {
                // بيانات افتراضية
                products = [
                    { id: 'p1', name: 'سماعة ساوند كور', price: 500, stock: 10, image: 'https://i.postimg.cc/BnFYkj9s/image-1.jpg', description: 'سماعة عالية الجودة' },
                    { id: 'p2', name: 'Airpods pro 2', price: 560, stock: 8, image: 'https://i.postimg.cc/t4qW1fBX/image-3.jpg', description: 'Airpods pro 2' },
                    { id: 'p3', name: 'جهاز تشغيل العاب', price: 350, stock: 15, image: 'https://i.postimg.cc/yYGYPbVz/image-1.png', description: 'جهاز تشغيل العاب الفيديو' },
                    { id: 'p4', name: 'السماعة الشرائط', price: 400, stock: 5, image: 'https://i.postimg.cc/pXHqtQqr/image-1.jpg', description: 'سماعة شرائط' }
                ];
                setLocalProducts(products);
            }
        }

        document.getElementById('loading-area').style.display = 'none';
        renderProducts();
    }

    // ============================================================
    //  RENDER PRODUCTS
    // ============================================================

    function renderProducts(filter = '') {
        const grid = document.getElementById('products-grid');
        let filtered = products;
        if (filter.trim()) {
            filtered = products.filter(p => 
                (p.name || '').toLowerCase().includes(filter.toLowerCase())
            );
        }
        if (!filtered.length) {
            grid.innerHTML = '<p style="opacity:0.5; grid-column:1/-1; text-align:center;">لا توجد منتجات مطابقة</p>';
            return;
        }
        grid.innerHTML = filtered.map((p) => {
            const fakePrice = Math.round(parseFloat(p.price) * 1.3);
            return `
            <div class="card" onclick="openDetails('${p.id}')">
                <span class="badge-sale">خصم</span>
                <img src="${p.image || ''}" alt="${p.name}" onerror="this.src='https://via.placeholder.com/200x200?text=No+Image'">
                <div class="card-info">
                    <div class="name">${p.name || 'بدون اسم'}</div>
                    <div class="price-wrap">
                        <span class="old-price">${fakePrice} ج.م</span>
                        <span class="price">${p.price} ج.م</span>
                    </div>
                </div>
            </div>`;
        }).join('');
    }

    function filterProducts() {
        const val = document.getElementById('searchInput').value;
        renderProducts(val);
    }

    // ============================================================
    //  DETAILS
    // ============================================================

    let currentP = null;
    let qty = 1;
    let cart = [];
    let isDirect = false;

    // تحميل السلة من LocalStorage عند بدء التشغيل
    function initCart() {
        cart = loadCart();
        document.getElementById('cartCount').innerText = cart.length;
    }

    function openDetails(id) {
        currentP = products.find(p => p.id === id);
        if (!currentP) return showToast('⚠️ المنتج غير موجود');
        qty = 1;
        const originalPrice = parseFloat(currentP.price);
        document.getElementById('qtyVal').innerText = qty;
        document.getElementById('dImg').src = currentP.image || 'https://via.placeholder.com/200x200?text=No+Image';
        document.getElementById('dTitle').innerText = currentP.name || 'بدون اسم';
        document.getElementById('dOldPrice').innerText = Math.round(originalPrice * 1.3) + ' ج.م';
        document.getElementById('dPrice').innerText = originalPrice + ' ج.م';
        document.getElementById('detailsModal').style.display = 'flex';
    }

    function changeQty(v) { qty = Math.max(1, qty + v); document.getElementById('qtyVal').innerText = qty; }

    // ============================================================
    //  CART WITH PERSISTENCE
    // ============================================================

    function addToCart() {
        if (!currentP) return;
        const existing = cart.find(c => c.id === currentP.id);
        if (existing) {
            existing.selectedQty += qty;
        } else {
            cart.push({ ...currentP, selectedQty: qty });
        }
        saveCart(cart); // حفظ في LocalStorage
        document.getElementById('cartCount').innerText = cart.length;
        closeModals();
        showToast('✅ أضيف للسلة');
    }

    function removeFromCart(index) {
        cart.splice(index, 1);
        saveCart(cart);
        document.getElementById('cartCount').innerText = cart.length;
        showToast('🗑️ تم الإزالة من السلة');
    }

    function goDirectOrder() { isDirect = true; closeModals(); showCheckout(); }
    
    function openCart() { 
        if (!cart.length) return showToast('🛒 السلة فارغة'); 
        isDirect = false; 
        showCheckout(); 
    }

    // ============================================================
    //  CHECKOUT
    // ============================================================

    function showCheckout() {
        const summary = document.getElementById('orderSummary');
        let subtotal = 0;
        if (isDirect) {
            subtotal = parseFloat(currentP.price) * qty;
            summary.innerHTML = `<strong>${currentP.name}</strong> (عدد: ${qty})`;
        } else {
            subtotal = cart.reduce((a, b) => a + (parseFloat(b.price) * b.selectedQty), 0);
            summary.innerHTML = cart.map((i, idx) => 
                `<div>• ${i.name} (x${i.selectedQty}) <span style="color:#ff6b6b;cursor:pointer;" onclick="removeFromCart(${idx})">✕</span></div>`
            ).join('');
        }
        document.getElementById('finalTotal').dataset.subtotal = subtotal;
        document.getElementById('checkoutModal').style.display = 'flex';
        calcFinal();
    }

    function calcFinal() {
        const sub = parseFloat(document.getElementById('finalTotal').dataset.subtotal) || 0;
        const ship = parseFloat(document.getElementById('shipCity').value) || 0;
        document.getElementById('finalTotal').innerText = (sub + ship) + ' ج.م';
    }

    // ============================================================
    //  ORDER PROCESS + TELEGRAM NOTIFICATION
    // ============================================================

    function startOrderProcess() {
        if (!document.getElementById('uName').value || !document.getElementById('uPhone').value || document.getElementById('shipCity').value === '0') {
            return showToast('⚠️ يرجى إكمال جميع البيانات');
        }
        document.getElementById('checkoutModal').style.display = 'none';
        const overlay = document.getElementById('confirm-overlay');
        const bar = document.getElementById('pBar');
        const text = document.getElementById('processText');
        overlay.style.display = 'flex';
        let width = 0;
        const interval = setInterval(() => {
            width += 2;
            bar.style.width = width + '%';
            if (width === 30) text.innerText = 'جاري مراجعة المخزون...';
            if (width === 60) text.innerText = 'تجهيز بيانات الشحن...';
            if (width >= 100) {
                clearInterval(interval);
                submitOrder();
            }
        }, 45);
    }

    async function submitOrder() {
        const name = document.getElementById('uName').value;
        const phone = document.getElementById('uPhone').value;
        const address = document.getElementById('uAddr').value;
        const city = document.getElementById('shipCity');
        const cityText = city.options[city.selectedIndex]?.text || '';
        const shipCost = parseFloat(city.value) || 0;
        const subtotal = parseFloat(document.getElementById('finalTotal').dataset.subtotal) || 0;
        const total = subtotal + shipCost;
        const productSummary = isDirect ? `${currentP.name} (x${qty})` : cart.map(i => `${i.name} (x${i.selectedQty})`).join(' , ');
        const fullAddress = `${address} - ${cityText}`;

        const orders = getOrders();
        const newOrder = {
            id: orders.length + 1,
            date: new Date().toLocaleString('ar-EG'),
            customerName: name,
            phone: phone,
            address: fullAddress,
            productName: productSummary,
            total: total,
            status: 'قيد المعالجة'
        };
        orders.push(newOrder);
        saveOrders(orders);

        // ============================================================
        //  إرسال رسالة تلغرام
        // ============================================================
        const telegramMessage = `
🛒 <b>طلب جديد!</b>

📋 رقم الطلب: #${newOrder.id}
👤 العميل: ${name}
📱 الهاتف: ${phone}
📍 العنوان: ${fullAddress}
📦 المنتجات: ${productSummary}
💰 الإجمالي: ${total} ج.م
📅 التاريخ: ${newOrder.date}
        `;
        await sendTelegramMessage(telegramMessage);

        // مسح السلة بعد الطلب
        if (!isDirect) {
            cart = [];
            saveCart(cart);
            document.getElementById('cartCount').innerText = 0;
        }

        document.getElementById('confirm-overlay').innerHTML = `
            <div style="font-size:70px;">🎉</div>
            <h2>تم الطلب بنجاح!</h2>
            <p style="opacity:0.7;">رقم الطلب: <strong style="color:var(--gold);">#${newOrder.id}</strong></p>
            <p style="opacity:0.5; font-size:0.9rem;">تم إرسال إشعار للفريق</p>
            <button class="btn-confirm" onclick="location.reload()" style="max-width:220px;">العودة للمتجر</button>
        `;

        showToast(`✅ تم حفظ الطلب #${newOrder.id}`);
    }

    // ============================================================
    //  ORDERS HISTORY
    // ============================================================

    function showOrdersHistory() {
        const orders = getOrders();
        const container = document.getElementById('ordersList');
        if (!orders.length) {
            container.innerHTML = `<div class="empty-orders">📭 لا توجد طلبات سابقة</div>`;
        } else {
            container.innerHTML = orders.slice().reverse().map(o => `
                <div class="order-item">
                    <div class="order-header">
                        <span class="order-id">#${o.id}</span>
                        <span class="order-status ${o.status === 'تم التسليم' ? 'delivered' : ''}">${o.status}</span>
                    </div>
                    <div style="font-weight:600;">${o.productName}</div>
                    <div class="order-details">
                        <div>👤 ${o.customerName} | 📱 ${o.phone}</div>
                        <div>📍 ${o.address}</div>
                        <div>💰 ${o.total} ج.م | 🕐 ${o.date}</div>
                    </div>
                </div>
            `).join('');
        }
        document.getElementById('ordersModal').style.display = 'flex';
    }

    // ============================================================
    //  HELPERS
    // ============================================================

    function showToast(msg) {
        const t = document.getElementById('toast');
        t.innerText = msg;
        t.style.display = 'block';
        clearTimeout(t._timer);
        t._timer = setTimeout(() => t.style.display = 'none', 3000);
    }

    function closeModals() {
        document.querySelectorAll('.modal').forEach(m => m.style.display = 'none');
    }

    document.querySelectorAll('.modal').forEach(m => {
        m.addEventListener('click', function(e) {
            if (e.target === this) this.style.display = 'none';
        });
    });

    // ============================================================
    //  INIT
    // ============================================================

    initCart(); // تحميل السلة المحفوظة
    syncProducts();
</script>
</body>
    </html>
